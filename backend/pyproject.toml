[project]
name = "work-daily-backend"
version = "0.1.0"
authors = [
    { name = "Hassan Zhang", email = "hassan121@163.com" }
]
requires-python = ">=3.10,<3.11"
dependencies = [
    "cryptography>=49.0.0",
    "fastapi>=0.138.0",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.49.0",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "ruff>=0.15.18",
]
