services:
  mysql:
    image: mysql:8.0
    container_name: work_daily_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: hassan0121
      MYSQL_DATABASE: todo
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  frontend:
    image: nginx:alpine
    ports:
      - "121:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

  backend:
    build: .
    volumes:
      - ./main.py:/app/main.py:ro
    environment:
      DATABASE_URL: mysql+pymysql://root:hassan0121@mysql:3306/todo
    depends_on:
      - mysql

volumes:
  mysql_data: