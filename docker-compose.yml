services:
  frontend:
    image: nginx:alpine
    ports:
      - "121:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

  backend:
    build: .
    volumes:
      - ./main.py:/app/main.py:ro
    environment:
      DATABASE_URL: mysql+pymysql://root:hassan0121@mysql:3306/todo
