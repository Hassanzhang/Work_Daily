version: "3.8"

services:
  frontend:
    image: nginx:alpine
    ports:
      - "121:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

  backend:
    image: tiangolo/uvicorn-gunicorn-fastapi:python3.10-slim
    volumes:
      - ./main.py:/app/main.py:ro
      - ./todo-data:/app/data
    command: uvicorn main.py:app --host 0.0.0.0 --port 8000
