services:
  mysql:
    image: mysql:8.0
    container_name: work_daily_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: hassan0121
      MYSQL_DATABASE: todo
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-phassan0121"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "121:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      MYSQL_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
